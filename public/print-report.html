<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提出内容の印刷</title>
<style>
  body { font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif; background:#F2F4F3; color:#1D2321; margin:0; padding:24px 16px; }
  .sheet { max-width:720px; margin:0 auto; background:#fff; border:1px solid #DBE1DF; border-radius:10px; padding:32px; }
  h1 { font-size:1.15rem; margin:0 0 18px; text-align:center; }
  .meta-row { display:flex; gap:24px; flex-wrap:wrap; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid #DBE1DF; }
  .meta-row div span { display:block; font-size:.72rem; color:#8A9490; }
  .meta-row div b { font-size:.95rem; }
  .body-text { line-height:1.9; font-size:.95rem; text-align:justify; }
  .body-text p { margin:0 0 1em; }
  .body-text p:last-child { margin-bottom:0; }
  .toolbar { max-width:720px; margin:0 auto 14px; text-align:right; }
  .toolbar button { background:#3A4E75; color:#fff; border:none; padding:9px 18px; border-radius:8px; font-size:.85rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .muted { color:#8A9490; font-size:.85rem; text-align:center; padding:40px 0; }
  @media print {
    body { background:#fff; padding:0; }
    .toolbar { display:none; }
    .sheet { border:none; padding:0; max-width:none; }
  }
</style>
</head>
<body>
  <div class="toolbar" id="toolbar" hidden>
    <button onclick="window.print()">🖨️ 印刷する（PDFとして保存も可能です）</button>
  </div>
  <div class="sheet" id="sheet">
    <p class="muted">読み込んでいます…</p>
  </div>

  <script>
    function escHtml_(v) {
      return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // 空行で区切られた段落ごとに、段落内の改行はスペースに詰めて幅いっぱいに折り返すようにする
    // (元の文章が1文ごとに改行されていると、そのまま表示すると行が短く途中で終わり、左に寄って見えるため)。
    function formatBodyText_(text) {
      var paragraphs = String(text || '').replace(/\r\n/g, '\n').split(/\n{2,}/);
      return paragraphs.map(function (p) {
        var joined = p.split('\n').map(function (line) { return line.trim(); }).filter(Boolean).join(' ');
        return joined ? '<p>' + escHtml_(joined) + '</p>' : '';
      }).join('');
    }

    var params = new URLSearchParams(location.search);
    var role = params.get('role') === 'admin' ? 'admin' : 'liff';
    var eid = params.get('eid') || '';
    var docKey = params.get('docKey') || 'sevenHabitsReport';

    var endpoint = role === 'admin'
      ? { url: '/api/admin/adminGetTextSubmissionForPrint', args: [eid, docKey] }
      : { url: '/api/liff/getTextSubmissionForPrint', args: [eid, docKey] };

    fetch(endpoint.url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ args: endpoint.args })
    }).then(function (res) { return res.json(); }).then(function (res) {
      if (!res.ok) throw new Error(res.error || '読み込みに失敗しました');
      var r = res.result;
      document.title = r.label + '_' + r.name;
      document.getElementById('sheet').innerHTML =
        '<h1>' + escHtml_(r.label) + '</h1>' +
        '<div class="meta-row">' +
        '<div><span>所属法人</span><b>' + escHtml_(r.company) + '</b></div>' +
        '<div><span>氏名</span><b>' + escHtml_(r.name) + '</b></div>' +
        '<div><span>提出日</span><b>' + escHtml_(r.submittedAt) + '</b></div>' +
        '</div>' +
        '<div class="body-text">' + formatBodyText_(r.textContent) + '</div>';
      document.getElementById('toolbar').hidden = false;
    }).catch(function (err) {
      document.getElementById('sheet').innerHTML = '<p class="muted" style="color:#C1443A;">' + escHtml_(err.message || String(err)) + '</p>';
    });
  </script>
</body>
</html>
