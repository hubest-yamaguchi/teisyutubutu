<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>入社書類管理システム</title>
  <style>
    body { font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif; background:#F2F4F3; color:#1D2321; margin:0; }
    header { background:#fff; border-bottom:1px solid #DBE1DF; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
    header h1 { font-size:1.05rem; margin:0; }
    #mainNav { display:flex; gap:8px; }
    #mainNav button { background:#E7EAF2; color:#3A4E75; border:none; padding:8px 14px; border-radius:999px; font-size:.82rem; font-weight:700; cursor:pointer; }
    #mainNav button.active { background:#3A4E75; color:#fff; }
    main { padding:24px; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:16px; }
    .kpi { background:#fff; border:1px solid #DBE1DF; border-radius:14px; padding:14px; }
    .kpi .label { font-size:.72rem; color:#8A9490; }
    .kpi .value { font-size:1.5rem; font-weight:700; }
    .kpi.clickable { cursor:pointer; }
    .kpi.clickable:hover { border-color:#3A4E75; }
    .kpi.active { border-color:#3A4E75; box-shadow:0 0 0 1px #3A4E75 inset; }

    /* ---- ダッシュボード: 左リスト + 右詳細 ---- */
    .dash-shell { display:flex; gap:16px; align-items:flex-start; }
    .list-pane { width:25%; min-width:240px; flex-shrink:0; background:#fff; border:1px solid #DBE1DF; border-radius:14px; overflow:hidden; }
    .list-head { padding:12px; border-bottom:1px solid #DBE1DF; }
    .list-head select { margin-bottom:6px; }
    .list-scroll { max-height:calc(100vh - 260px); overflow-y:auto; }
    .person-row { display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer; border-bottom:1px solid #EEF0F1; }
    .person-row:hover { background:#F6F8F7; }
    .person-row.active { background:#E7EAF2; }
    .avatar { border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; background:#3A4E75; }
    .person-meta { min-width:0; flex:1; }
    .person-name { font-size:.85rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .person-sub { font-size:.7rem; color:#8A9490; margin-top:1px; }
    .status-pill { font-size:.66rem; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap; flex-shrink:0; }
    .status-complete { background:#E9F5EA; color:#3F9142; }
    .status-none { background:#EEF0F1; color:#8B929A; }
    .status-partial { background:#FBF0DD; color:#C4881B; }
    .detail-pane { flex:1; min-width:0; background:#fff; border:1px solid #DBE1DF; border-radius:14px; padding:20px; }
    .detail-head { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
    .detail-head h2 { margin:0 0 3px; font-size:1.1rem; }
    @media (max-width:860px) {
      .dash-shell { flex-direction:column; }
      .list-pane { width:100%; }
    }
    table { width:100%; border-collapse:collapse; background:#fff; border:1px solid #DBE1DF; border-radius:14px; overflow:hidden; }
    th, td { text-align:left; padding:10px 14px; border-bottom:1px solid #EEF0F1; font-size:.85rem; }
    th { background:#E8EBEA; font-size:.7rem; text-transform:uppercase; color:#8A9490; }
    tr.row:hover { background:#F6F8F7; cursor:pointer; }
    .pill { display:inline-block; font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:999px; }
    .st-未提出 { background:#EEF0F1; color:#8B929A; }
    .st-確認中 { background:#E6EFFB; color:#3B7DD8; }
    .st-差し戻し { background:#FBEAE8; color:#C1443A; }
    .st-承認済 { background:#E9F5EA; color:#3F9142; }
    .st-原本提出待ち { background:#FBF0DD; color:#C4881B; }
    .st-対象外 { background:transparent; color:#AAB2AE; border:1px dashed #C4CCC9; }
    .card { background:#fff; border:1px solid #DBE1DF; border-radius:14px; padding:16px; margin-bottom:14px; }
    select, input[type=text], input[type=email], input[type=date], textarea { width:100%; padding:8px 10px; border:1px solid #DBE1DF; border-radius:8px; font-size:.85rem; box-sizing:border-box; }
    button.btn { background:#3A4E75; color:#fff; border:none; padding:8px 14px; border-radius:8px; font-size:.82rem; font-weight:700; cursor:pointer; }
    button.btn.approve { background:#3F9142; }
    button.btn.danger { background:#C1443A; }
    button.btn.ghost { background:#E7EAF2; color:#3A4E75; }
    button.btn.pending { background:#C4CCC9; color:#5B6560; cursor:not-allowed; }
    button.btn:disabled { cursor:not-allowed; }
    .doc-row { border:1px solid #DBE1DF; border-radius:10px; padding:10px 12px; margin-bottom:8px; }
    .muted { color:#8A9490; font-size:.8rem; }
    .row-flex { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .chip { background:#fff; border:1px solid #DBE1DF; border-radius:999px; padding:4px 10px; font-size:.72rem; cursor:pointer; }
    label.check { display:inline-flex; align-items:center; gap:4px; font-size:.8rem; color:#4A544F; margin-right:10px; }
    .devbar { background:#3A2E00; color:#F5D98A; font-size:.72rem; padding:4px 12px; }
    .devbar input { width:auto; display:inline-block; background:#fff; padding:2px 6px; border-radius:4px; border:none; font-size:.72rem; }

    /* ---- LINEメッセージ ---- */
    .chat-scroll { max-height:320px; overflow-y:auto; border:1px solid #DBE1DF; border-radius:10px; padding:10px; background:#F6F8F7; margin-bottom:8px; }
    .chat-row { display:flex; flex-direction:column; margin-bottom:10px; }
    .chat-row.out { align-items:flex-end; }
    .chat-row.in { align-items:flex-start; }
    .chat-bubble { max-width:75%; border:1px solid #DBE1DF; border-radius:12px; padding:8px 12px; font-size:.85rem; }
    .chat-row.out .chat-bubble { background:#3A4E75; color:#fff; border-color:#3A4E75; }
    .chat-row.in .chat-bubble { background:#fff; color:#1D2321; }
    .chat-bubble img { max-width:220px; border-radius:8px; display:block; cursor:pointer; }
    .chat-meta { font-size:.66rem; color:#8A9490; margin-top:2px; }

    /* ---- 保存完了トースト ---- */
    .toast { position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px); background:#1D2321; color:#fff; padding:10px 20px; border-radius:999px; font-size:.85rem; font-weight:700; box-shadow:0 6px 20px rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:100; display:flex; align-items:center; gap:8px; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .toast .check { color:#6FC076; font-weight:700; }

    /* ---- ログイン画面 ---- */
    .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; }
    .login-card { background:#fff; border:1px solid #DBE1DF; border-radius:16px; padding:32px; width:100%; max-width:360px; }
    .login-card h1 { font-size:1.1rem; margin:0 0 4px; }
    .login-card p.sub { margin:0 0 20px; color:#8A9490; font-size:.82rem; }
    .login-card label { display:block; font-size:.78rem; color:#4A544F; margin:12px 0 4px; }
    .login-card input[type=email], .login-card input[type=password], .login-card input[type=text] { width:100%; padding:9px 10px; border:1px solid #DBE1DF; border-radius:8px; font-size:.88rem; box-sizing:border-box; }
    .login-card .error { color:#C1443A; font-size:.78rem; margin-top:10px; }
    .login-card .switch { margin-top:18px; text-align:center; }
    .login-card .switch a { color:#3A4E75; font-size:.8rem; cursor:pointer; text-decoration:underline; }

    /* ---- 設定ページ: サイドタブ ---- */
    .settings-shell { display:flex; gap:20px; align-items:flex-start; }
    .settings-side { width:220px; flex-shrink:0; background:#fff; border:1px solid #DBE1DF; border-radius:14px; padding:12px 8px; }
    .settings-side-label { font-size:.68rem; color:#8A9490; text-transform:uppercase; letter-spacing:.04em; margin:14px 10px 6px; }
    .settings-side-label:first-child { margin-top:2px; }
    .settings-tab { display:flex; align-items:center; gap:6px; width:100%; text-align:left; border:none; background:none; padding:9px 10px; border-radius:8px; font-size:.84rem; color:#1D2321; cursor:pointer; font-family:inherit; }
    .settings-tab:hover { background:#F6F8F7; }
    .settings-tab.active { background:#3A4E75; color:#fff; font-weight:700; }
    .settings-tab .handle { cursor:grab; color:#C4CCC9; font-size:.75rem; touch-action:none; }
    .settings-tab.active .handle { color:#B9C4E0; }
    .settings-tab.drag-over { box-shadow:0 -2px 0 #3A4E75 inset; }
    .settings-tab.dragging { opacity:.5; }
    .settings-content { flex:1; min-width:0; }
    .doc-row .handle { touch-action:none; }
    .doc-row.drag-over { box-shadow:0 -2px 0 #3A4E75 inset; }
    .doc-row.dragging { opacity:.5; }
    @media (max-width:760px) {
      .settings-shell { flex-direction:column; }
      .settings-side { width:100%; display:flex; flex-wrap:wrap; gap:4px; }
      .settings-side-label { width:100%; }
    }
  </style>
</head>
<body>
  <div class="devbar" id="devbar" style="display:none;">
    ローカル開発用の認証バイパス中: <input type="text" id="devEmailInput" placeholder="管理者として扱うメールアドレス">
    <button onclick="saveDevEmail()" style="font-size:.72rem;">設定</button>
  </div>
  <header>
    <h1>入社書類管理システム</h1>
    <div style="display:flex;align-items:center;gap:14px;">
      <span id="greeting" class="muted"></span>
      <nav id="mainNav"></nav>
    </div>
  </header>
  <main id="main"><p class="muted">読み込み中です…</p></main>
  <div class="toast" id="toast"><span class="check">✓</span><span id="toastText"></span></div>

  <script>
    var CURRENT_COMPANY_FILTER = 'すべて';
    var CURRENT_EMAIL = null;
    var CURRENT_NAME = '';

    // ローカル開発(wrangler dev)では、ログイン画面を経由せずX-Debug-Admin-Emailで代わりに認証できる。
    var IS_LOCAL_DEV = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
    if (IS_LOCAL_DEV) {
      document.getElementById('devbar').style.display = 'block';
      document.getElementById('devEmailInput').value = localStorage.getItem('devAdminEmail') || '';
    }
    function saveDevEmail() {
      localStorage.setItem('devAdminEmail', document.getElementById('devEmailInput').value.trim());
      CURRENT_EMAIL = localStorage.getItem('devAdminEmail');
      CURRENT_NAME = '';
      go('dashboard');
    }

    // input要素のvalue属性に値を埋め込む際、値に " が含まれると属性が途中で閉じてしまうため使う
    function escAttr(v) {
      return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    }

    // 保存操作の完了を目で見て分かるように、画面下に短く「保存しました」を表示する
    var TOAST_TIMER_ = null;
    function showToast(message) {
      var el = document.getElementById('toast');
      if (!el) return;
      document.getElementById('toastText').textContent = message || '保存しました';
      el.classList.add('show');
      clearTimeout(TOAST_TIMER_);
      TOAST_TIMER_ = setTimeout(function () { el.classList.remove('show'); }, 2200);
    }

    // 設定ページの各保存操作の.then()から呼ぶ共通ハンドラ(再描画 + トースト表示)
    function renderSettingsAndToast_(res) {
      renderSettings(res);
      showToast('保存しました');
    }

    function updateGreeting_() {
      var el = document.getElementById('greeting');
      if (!el) return;
      el.textContent = CURRENT_EMAIL ? 'ようこそ、' + (CURRENT_NAME || CURRENT_EMAIL) + 'さん' : '';
    }

    // パスワード入力欄の隣に「表示」チェックボックスを付け、入力内容を確認できるようにする
    function pwFieldHtml(id, labelHtml) {
      return '<label>' + labelHtml + '</label>' +
        '<div class="row-flex" style="flex-wrap:nowrap;">' +
        '<input type="password" id="' + id + '" style="flex:1;">' +
        '<label class="check" style="margin:0;white-space:nowrap;"><input type="checkbox" onchange="document.getElementById(\'' + id + '\').type=this.checked?\'text\':\'password\'"> 表示</label>' +
        '</div>';
    }

    function callServer_(fn, args) {
      var headers = { 'Content-Type': 'application/json' };
      if (IS_LOCAL_DEV) headers['X-Debug-Admin-Email'] = localStorage.getItem('devAdminEmail') || '';
      return fetch('/api/admin/' + fn, { method: 'POST', headers: headers, credentials: 'same-origin', body: JSON.stringify({ args: args || [] }) })
        .then(function (httpRes) {
          if (httpRes.status === 401 && !IS_LOCAL_DEV) {
            CURRENT_EMAIL = null;
            renderLogin('login', 'セッションの期限が切れました。もう一度ログインしてください。');
            throw new Error('__redirected_to_login__');
          }
          return httpRes.json();
        })
        .then(function (res) {
          if (!res.ok) throw new Error(res.error || 'サーバーエラーが発生しました');
          return res.result;
        });
    }

    function callAuth_(fn, body) {
      return fetch('/api/auth/' + fn, { method: fn === 'me' ? 'GET' : 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: fn === 'me' ? undefined : JSON.stringify(body || {}) })
        .then(function (res) { return res.json(); })
        .then(function (res) {
          if (!res.ok) throw new Error(res.error || 'サーバーエラーが発生しました');
          return res.result;
        });
    }

    // ---------- ログイン ----------
    function renderLogin(mode, errorMsg) {
      var isClaim = mode === 'claim';
      document.getElementById('mainNav').innerHTML = '';
      document.getElementById('main').innerHTML =
        '<div class="login-wrap"><div class="login-card">' +
        '<h1>入社書類管理システム</h1>' +
        '<p class="sub">' + (isClaim ? '初めてログインする方は、ここでパスワードを設定してください。' : '管理者アカウントでログインしてください。') + '</p>' +
        (isClaim ? '<label>氏名</label><input type="text" id="authName">' : '') +
        '<label>メールアドレス</label><input type="email" id="authEmail">' +
        pwFieldHtml('authPassword', 'パスワード' + (isClaim ? '（8文字以上・新しく設定）' : '')) +
        '<div style="height:14px;"></div>' +
        '<button class="btn" style="width:100%;" onclick="' + (isClaim ? 'doClaim()' : 'doLogin()') + '">' + (isClaim ? 'パスワードを設定してログイン' : 'ログイン') + '</button>' +
        '<div id="authError" class="error"></div>' +
        '<div class="switch"><a onclick="renderLogin(\'' + (isClaim ? 'login' : 'claim') + '\')">' +
        (isClaim ? 'すでにパスワードを設定済みの方はこちら' : '初めてこのメールアドレスを使う方はこちら') +
        '</a></div>' +
        '</div></div>';
      if (errorMsg) document.getElementById('authError').textContent = errorMsg;
    }

    function doLogin() {
      var email = document.getElementById('authEmail').value.trim();
      var password = document.getElementById('authPassword').value;
      callAuth_('login', { email: email, password: password }).then(function (res) {
        CURRENT_EMAIL = res.email;
        CURRENT_NAME = res.name || '';
        go('dashboard');
      }).catch(function (err) { renderLogin('login', err.message); });
    }

    function doClaim() {
      var name = document.getElementById('authName').value.trim();
      var email = document.getElementById('authEmail').value.trim();
      var password = document.getElementById('authPassword').value;
      callAuth_('claim', { name: name, email: email, password: password }).then(function (res) {
        CURRENT_EMAIL = res.email;
        CURRENT_NAME = res.name || '';
        go('dashboard');
      }).catch(function (err) { renderLogin('claim', err.message); });
    }

    function doLogout() {
      callAuth_('logout').then(function () {
        CURRENT_EMAIL = null;
        CURRENT_NAME = '';
        updateGreeting_();
        renderLogin('login');
      });
    }

    function navHtml(active) {
      var items = [['dashboard', 'ダッシュボード'], ['settings', '設定']];
      var html = items.map(function (it) {
        return '<button class="' + (it[0] === active ? 'active' : '') + '" onclick="go(\'' + it[0] + '\')">' + it[1] + '</button>';
      }).join('');
      if (!IS_LOCAL_DEV) html += '<button class="ghost" style="background:none;color:#8A9490;" onclick="doLogout()">ログアウト</button>';
      return html;
    }

    function go(page) {
      document.getElementById('mainNav').innerHTML = navHtml(page);
      updateGreeting_();
      if (page === 'dashboard') loadDashboard();
      if (page === 'settings') loadSettings();
    }

    function boot() {
      if (IS_LOCAL_DEV) { CURRENT_EMAIL = localStorage.getItem('devAdminEmail'); go('dashboard'); return; }
      callAuth_('me').then(function (res) {
        if (res.email) { CURRENT_EMAIL = res.email; CURRENT_NAME = res.name || ''; go('dashboard'); }
        else { renderLogin('login'); }
      }).catch(function () { renderLogin('login'); });
    }

    function showError(err) {
      if (err && err.message === '__redirected_to_login__') return;
      document.getElementById('main').innerHTML = '<div class="card"><p>エラー: ' + (err && err.message ? err.message : err) + '</p></div>';
    }

    // ---------- ダッシュボード(左:内定者リスト / 右:詳細) ----------
    var DASH_STAGE_FILTER = null; // null=全件、またはKPIの5ステータスのいずれか
    var DASH_SEARCH = '';
    var DASH_SELECTED_ID = null;
    var CURRENT_DETAIL_ID = null;
    var TEMPLATES = null;

    function loadDashboard() {
      callServer_('adminGetDashboard', [CURRENT_COMPANY_FILTER]).then(function (data) {
        window.__lastDashboard = data;
        if (!TEMPLATES) callServer_('adminGetTemplates', []).then(function (t) { TEMPLATES = t; });
        renderDashboard();
      }).catch(showError);
    }

    function onCompanyFilterChange() {
      CURRENT_COMPANY_FILTER = document.getElementById('companyFilter').value;
      loadDashboard();
    }

    function setStageFilter_(stage) {
      DASH_STAGE_FILTER = stage;
      renderDashboard();
    }

    function onDashSearch_(v) {
      DASH_SEARCH = v;
      renderDashboard();
    }

    function filteredDashRows_() {
      var data = window.__lastDashboard;
      if (!data) return [];
      return data.rows.filter(function (r) {
        if (DASH_STAGE_FILTER && r.stage !== DASH_STAGE_FILTER) return false;
        if (DASH_SEARCH && r.name.indexOf(DASH_SEARCH) === -1) return false;
        return true;
      });
    }

    // 「提出完了／未提出／一部提出」は、書類ごとの詳細ステータスとは別に、リストで一目で分かるようまとめたもの
    function overallStatus_(r) {
      var progress = r.docsSubmitted + '/' + r.docsTotal;
      if (r.progressPct === 0) return { key: 'none', label: '未提出', progress: progress };
      if (r.progressPct === 100) return { key: 'complete', label: '提出完了', progress: progress };
      return { key: 'partial', label: '一部提出', progress: progress };
    }

    var AVATAR_COLORS = ['#3A4E75', '#3F9142', '#C4881B', '#C1443A', '#6B4FA0', '#2B8C8C'];
    function avatarHtml_(person, size) {
      size = size || 36;
      if (person.pictureUrl) {
        return '<img src="' + escAttr(person.pictureUrl) + '" class="avatar" style="width:' + size + 'px;height:' + size + 'px;object-fit:cover;">';
      }
      var name = person.name || '';
      var sum = 0;
      for (var i = 0; i < name.length; i++) sum += name.charCodeAt(i);
      var color = AVATAR_COLORS[sum % AVATAR_COLORS.length];
      return '<div class="avatar" style="width:' + size + 'px;height:' + size + 'px;line-height:' + size + 'px;background:' + color + ';font-size:' + Math.round(size * 0.42) + 'px;">' + name.slice(0, 1) + '</div>';
    }

    function renderDashboard() {
      var data = window.__lastDashboard;
      if (!data) return;
      var kpiKeys = ['total', '未提出', '確認中', '差し戻し', '原本待ち', '受入準備完了'];
      var kpiLabels = { total: '全新入社員', '未提出': '未提出', '確認中': '確認中', '差し戻し': '差し戻し中', '原本待ち': '原本提出待ち', '受入準備完了': '受入準備完了' };
      var kpiHtml = kpiKeys.map(function (k) {
        var filterVal = k === 'total' ? null : k;
        var isActive = DASH_STAGE_FILTER === filterVal;
        return '<div class="kpi clickable' + (isActive ? ' active' : '') + '" onclick="setStageFilter_(' + (filterVal ? "'" + filterVal + "'" : 'null') + ')">' +
          '<div class="label">' + kpiLabels[k] + '</div><div class="value">' + (data.kpi[k] || 0) + '</div></div>';
      }).join('');

      var companyOptions = ['すべて'].concat(data.companies).map(function (c) {
        return '<option ' + (c === CURRENT_COMPANY_FILTER ? 'selected' : '') + '>' + c + '</option>';
      }).join('');

      var rows = filteredDashRows_();
      if (DASH_SELECTED_ID && !rows.some(function (r) { return r.id === DASH_SELECTED_ID; })) DASH_SELECTED_ID = null;
      if (!DASH_SELECTED_ID && rows.length) DASH_SELECTED_ID = rows[0].id;

      var listHtml = rows.map(function (r) {
        var st = overallStatus_(r);
        return '<div class="person-row' + (r.id === DASH_SELECTED_ID ? ' active' : '') + '" onclick="selectPerson_(\'' + r.id + '\')">' +
          avatarHtml_(r, 36) +
          '<div class="person-meta"><div class="person-name">' + r.name + '</div><div class="person-sub">' + (r.company || '未回答') + ' ・ ' + st.progress + '</div></div>' +
          '<span class="status-pill status-' + st.key + '">' + st.label + '</span>' +
          '</div>';
      }).join('') || '<p class="muted" style="padding:16px;">該当する新入社員がいません</p>';

      document.getElementById('main').innerHTML =
        '<div class="kpi-row">' + kpiHtml + '</div>' +
        '<div class="dash-shell">' +
        '<div class="list-pane">' +
        '<div class="list-head">' +
        '<select id="companyFilter" onchange="onCompanyFilterChange()">' + companyOptions + '</select>' +
        '<input type="text" placeholder="名前で検索" value="' + escAttr(DASH_SEARCH) + '" oninput="onDashSearch_(this.value)">' +
        '</div>' +
        '<div class="list-scroll">' + listHtml + '</div>' +
        '</div>' +
        '<div class="detail-pane" id="detailPane"></div>' +
        '</div>';

    function selectPerson_(id) {
      DASH_SELECTED_ID = id;
      renderDashboard();
    }

    function renderDetailPane_() {
      var pane = document.getElementById('detailPane');
      if (!pane) return;
      if (!DASH_SELECTED_ID) { pane.innerHTML = '<p class="muted">左のリストから内定者を選択してください</p>'; return; }
      callServer_('adminGetEmployeeDetail', [DASH_SELECTED_ID]).then(renderDetail).catch(showError);
    }

    var BATCH_REJECT_KEYS = [];

    function emergencyContactsHtml_(contacts) {
      if (!contacts || !contacts.length) return '<p class="muted">未登録</p>';
      return contacts.map(function (c, i) {
        var name = (c.LastName || '') + ' ' + (c.FirstName || '');
        var kana = (c.LastNameKana || c.FirstNameKana) ? ' (' + c.LastNameKana + ' ' + c.FirstNameKana + ')' : '';
        var address = [c.Prefecture, c.City, c.AddressLine, c.Building].filter(Boolean).join(' ');
        return '<div class="doc-row"><b>' + escHtml_(name) + escHtml_(kana) + (c.Relationship ? '（' + escHtml_(c.Relationship) + '）' : '') + '</b>' +
          '<div class="muted">' +
          (c.PhoneNumber ? '電話: ' + escHtml_(c.PhoneNumber) + ' ' : '') +
          (c.Email ? '/ E-mail: ' + escHtml_(c.Email) : '') +
          '</div>' +
          (address || c.PostalCode ? '<div class="muted">住所: ' + (c.PostalCode ? '〒' + escHtml_(c.PostalCode) + ' ' : '') + escHtml_(address) + '</div>' : '') +
          '</div>';
      }).join('');
    }

    function renderDetail(data) {
      CURRENT_DETAIL_ID = data.employee.id;
      BATCH_REJECT_KEYS = [];
      var e = data.employee;
      var docsHtml = data.docs.map(function (d) {
        if (d.status === '対象外') {
          return '<div class="doc-row" style="opacity:.5;"><b>' + d.label + '</b> <span class="pill st-対象外">対象外</span></div>';
        }
        if (d.restrictedView) {
          return '<div class="doc-row"><b>' + d.label + '</b> <span class="muted">（マイナンバー閲覧権限が無いため非表示）</span></div>';
        }
        var actions = '';
        var canReject = d.status === '確認中' || d.status === '原本提出待ち';
        if (d.hasFile) {
          actions += '<button class="btn ghost" onclick="viewFile(\'' + d.key + '\')">書類を表示</button> ';
          actions += '<button class="btn ghost" onclick="downloadFile(\'' + d.key + '\')">ダウンロード</button> ';
        }
        if (d.status === '確認中') {
          actions += '<button class="btn approve" onclick="approveDoc(\'' + d.key + '\')">承認</button> ';
        }
        if (canReject) {
          actions += '<label class="check" style="margin-left:4px;"><input type="checkbox" onchange="toggleBatchReject(\'' + d.key + '\', this.checked)"> 差し戻す</label>';
        }
        var reasonHtml = d.status === '差し戻し' ? '<div class="muted" style="color:#C1443A;">' + d.rejectReason + '</div>' : '';
        var metaHtml = d.submittedAt ? '<div class="muted" style="margin-top:4px;">提出日時: ' + d.submittedAt + '</div>' : '';
        var batchArea = canReject
          ? '<div id="batchArea-' + d.key + '" style="display:none;margin-top:8px;padding-top:8px;border-top:1px solid #EEF0F1;">' +
            '<div class="row-flex" id="batchChips-' + d.key + '"></div>' +
            '<textarea id="batchReason-' + d.key + '" rows="2" placeholder="差し戻し理由" style="margin-top:6px;"></textarea>' +
            '</div>'
          : '';
        return '<div class="doc-row"><b>' + d.label + (d.requiresOriginal ? '（原本）' : '') + '</b> ' +
          '<span class="pill st-' + d.status + '">' + d.status + '</span>' +
          reasonHtml + metaHtml +
          '<div style="margin-top:6px;">' + actions + '</div>' +
          batchArea +
          '</div>';
      }).join('');

      var applicableDocs = data.docs.filter(function (d) { return d.status !== '対象外'; });
      var submittedDocs = applicableDocs.filter(function (d) { return d.status !== '未提出'; });
      var progressLabel = submittedDocs.length + '/' + applicableDocs.length;
      var hasAnyFile = data.docs.some(function (d) { return d.hasFile; });

      document.getElementById('detailPane').innerHTML =
        '<div class="detail-head">' + avatarHtml_(e, 56) +
        '<div><h2>' + e.name + '</h2><p class="muted">' + (e.company || '未回答') + ' ・ ' + (e.commute || '未回答') + ' ・ 入社予定日 ' + (e.hireDate || '未回答') + '</p></div>' +
        '<span class="status-pill" style="margin-left:auto;font-size:.78rem;padding:5px 12px;background:#E7EAF2;color:#3A4E75;">提出状況 ' + progressLabel + '</span>' +
        '</div>' +
        (!e.company || !e.commute ? '<p class="muted" style="color:#C4881B;">※配属先・通勤手段は本人がLINEで回答するとここに反映されます</p>' : '') +
        (hasAnyFile ? '<div style="margin-bottom:12px;"><button class="btn ghost" onclick="downloadAllFiles()">提出書類をまとめてダウンロード（ZIP）</button></div>' : '') +
        '<hr><h3>緊急連絡先</h3>' +
        emergencyContactsHtml_(data.emergencyContacts) +
        docsHtml +
        '<div class="row-flex" id="batchBar" style="display:none;margin-top:10px;padding:10px 0;border-top:1px solid #EEF0F1;">' +
        '<span class="muted" id="batchCount"></span>' +
        '<button class="btn danger" onclick="sendBatchReject()">選択した書類をまとめて差し戻す</button>' +
        '</div>' +
        '<hr><h3>LINEメッセージ</h3>' +
        '<p class="muted">公式LINEアカウントに届いたメッセージをここで確認し、そのまま返信できます。</p>' +
        '<div class="chat-scroll" id="chatMessages"><p class="muted">読み込み中…</p></div>' +
        '<div class="row-flex" style="flex-wrap:nowrap;">' +
        '<input type="text" id="chatInput" placeholder="メッセージを入力" style="flex:1;" onkeydown="if(event.key===\'Enter\'){event.preventDefault();sendChatMessage();}">' +
        '<button class="btn" onclick="sendChatMessage()">送信</button>' +
        '</div>' +
        '<div id="chatSendError" class="muted" style="color:#C1443A;margin-top:4px;"></div>' +
        '<hr><h3>Google Driveへの保存</h3>' +
        '<p class="muted">承認済みの書類をまとめて、社員ごとのDriveフォルダに保存します（アップロード時の自動保存ではなく、押した時だけ実行されます）。</p>' +
        (e.driveSavedAt ? '<p><span class="status-pill" style="background:#E9F5EA;color:#3F9142;">Drive保存済み ' + e.driveSavedAt + '</span></p>' : '') +
        '<button class="btn ghost" id="driveSaveBtn" onclick="saveToDrive()">承認済み書類をDriveに保存</button>' +
        '<hr><h3>jinjer連携</h3>' +
        '<p class="muted">緊急連絡先をjinjerに登録します（続柄・都道府県/市区町村は分かる範囲でコードを引き当てます）。' +
        (e.jinjerEmployeeId ? 'jinjer社員番号: ' + e.jinjerEmployeeId : '<b style="color:#C4881B;">jinjer社員番号が未設定です（「設定」＞「新入社員登録」で入力してください）</b>') +
        '。jinjer側は登録専用（更新不可）のため、送信は1回のみ行えます。承認済み書類のファイル送信は、書類マスタでjinjerカスタム項目コードを設定した書類のみが対象です。</p>' +
        (e.jinjerSyncedAt ? '<p><span class="status-pill" style="background:#E9F5EA;color:#3F9142;">緊急連絡先 送信済み ' + e.jinjerSyncedAt + '</span></p>' : '') +
        '<button class="btn ghost" id="jinjerSyncBtn" onclick="syncToJinjer()"' + (e.jinjerSyncedAt ? ' disabled' : '') + '>緊急連絡先をjinjerに登録</button> ' +
        '<button class="btn ghost" id="jinjerFilesBtn" onclick="sendFilesToJinjer()">承認済み書類をjinjerに送る</button>' +
        '<hr><h3>リマインダー送信</h3>' +
        '<div class="row-flex" id="reminderTpl"></div>' +
        '<textarea id="reminderText" rows="3" placeholder="送信内容"></textarea>' +
        '<div style="height:8px;"></div><button class="btn" onclick="sendReminder()">LINEで送信</button>';

      if (TEMPLATES) { renderReminderChips(); renderBatchChips_(); }
      loadMessages_();
      startChatPoll_();
    }

    // 「差し戻す」チェックボックスON/OFFで、その書類の理由入力欄を開閉する
    function toggleBatchReject(key, checked) {
      var area = document.getElementById('batchArea-' + key);
      if (area) area.style.display = checked ? 'block' : 'none';
      var idx = BATCH_REJECT_KEYS.indexOf(key);
      if (checked && idx === -1) BATCH_REJECT_KEYS.push(key);
      if (!checked && idx !== -1) BATCH_REJECT_KEYS.splice(idx, 1);
      var bar = document.getElementById('batchBar');
      bar.style.display = BATCH_REJECT_KEYS.length ? 'flex' : 'none';
      document.getElementById('batchCount').textContent = BATCH_REJECT_KEYS.length + '件選択中';
    }

    function renderBatchChips_() {
      if (!TEMPLATES) return;
      document.querySelectorAll('[id^="batchChips-"]').forEach(function (el) {
        var key = el.id.replace('batchChips-', '');
        el.innerHTML = TEMPLATES.rejectTemplates.map(function (t, i) {
          return '<span class="chip" onclick="document.getElementById(\'batchReason-' + key + '\').value=' + JSON.stringify(t.text).replace(/"/g, '&quot;') + '">' + t.title + '</span>';
        }).join('');
      });
    }

    function sendBatchReject() {
      var items = BATCH_REJECT_KEYS.map(function (key) {
        return { docKey: key, reason: document.getElementById('batchReason-' + key).value.trim() };
      });
      var missing = items.filter(function (it) { return !it.reason; });
      if (missing.length) { showError(new Error('差し戻し理由が未入力の書類があります')); return; }
      callServer_('adminRejectDocsBatch', [CURRENT_DETAIL_ID, items]).then(function () {
        showToast('差し戻しを送信しました（' + items.length + '件を1通にまとめて送信）');
        loadDashboard();
      }).catch(showError);
    }

    function renderReminderChips() {
      var el = document.getElementById('reminderTpl');
      if (!el || !TEMPLATES) return;
      el.innerHTML = TEMPLATES.reminderTemplates.map(function (t, i) {
        return '<span class="chip" onclick="pickReminderTpl(' + i + ')">' + t.title + '</span>';
      }).join('');
    }

    function pickReminderTpl(i) {
      document.getElementById('reminderText').value = TEMPLATES.reminderTemplates[i].text;
    }

    function sendReminder() {
      var text = document.getElementById('reminderText').value.trim();
      if (!text) return;
      callServer_('adminSendReminder', [CURRENT_DETAIL_ID, text]).then(function () {
        alert('送信しました');
        loadDashboard();
      }).catch(showError);
    }

    function adminAuthHeaders_() {
      var headers = {};
      if (IS_LOCAL_DEV) headers['X-Debug-Admin-Email'] = localStorage.getItem('devAdminEmail') || '';
      return headers;
    }

    function viewFile(docKey) {
      var url = '/api/admin/file?employeeId=' + encodeURIComponent(CURRENT_DETAIL_ID) + '&docKey=' + encodeURIComponent(docKey);
      fetch(url, { headers: adminAuthHeaders_() }).then(function (res) {
        if (!res.ok) return res.json().then(function (e) { throw new Error(e.error || 'ファイルの取得に失敗しました'); });
        return res.blob();
      }).then(function (blob) {
        window.open(URL.createObjectURL(blob), '_blank');
      }).catch(showError);
    }

    // Content-Dispositionヘッダー(filename*=UTF-8''...)からファイル名を取り出す
    function filenameFromContentDisposition_(cd, fallback) {
      if (!cd) return fallback;
      var m = /filename\*=UTF-8''([^;]+)/.exec(cd);
      return m ? decodeURIComponent(m[1]) : fallback;
    }

    // blobをdownload属性付きの一時リンクとしてクリックさせ、ブラウザに保存させる
    function triggerBlobDownload_(blob, fileName) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    function downloadFile(docKey) {
      var url = '/api/admin/file?employeeId=' + encodeURIComponent(CURRENT_DETAIL_ID) + '&docKey=' + encodeURIComponent(docKey) + '&download=1';
      fetch(url, { headers: adminAuthHeaders_() }).then(function (res) {
        if (!res.ok) return res.json().then(function (e) { throw new Error(e.error || 'ファイルの取得に失敗しました'); });
        var fileName = filenameFromContentDisposition_(res.headers.get('Content-Disposition'), 'document');
        return res.blob().then(function (blob) { triggerBlobDownload_(blob, fileName); });
      }).catch(showError);
    }

    function downloadAllFiles() {
      var url = '/api/admin/files.zip?employeeId=' + encodeURIComponent(CURRENT_DETAIL_ID);
      fetch(url, { headers: adminAuthHeaders_() }).then(function (res) {
        if (!res.ok) return res.json().then(function (e) { throw new Error(e.error || 'ダウンロードに失敗しました'); });
        var fileName = filenameFromContentDisposition_(res.headers.get('Content-Disposition'), 'documents.zip');
        return res.blob().then(function (blob) { triggerBlobDownload_(blob, fileName); });
      }).catch(showError);
    }

    function approveDoc(docKey) {
      callServer_('adminApproveDoc', [CURRENT_DETAIL_ID, docKey]).then(function () { loadDashboard(); }).catch(showError);
    }

    function saveToDrive() {
      var btn = document.getElementById('driveSaveBtn');
      if (btn) {
        btn.disabled = true;
        btn.classList.remove('ghost', 'approve', 'danger');
        btn.classList.add('pending');
        btn.textContent = '保存中…';
      }
      callServer_('adminSaveToDrive', [CURRENT_DETAIL_ID]).then(function () {
        if (btn) {
          btn.classList.remove('pending');
          btn.classList.add('approve');
          btn.textContent = '保存しました ✓';
        }
        showToast('Driveに保存しました');
        setTimeout(function () { loadDashboard(); }, 900);
      }).catch(function (err) {
        if (btn) {
          btn.disabled = false;
          btn.classList.remove('pending');
          btn.classList.add('danger');
          btn.textContent = '保存に失敗しました（再試行）';
        }
        showError(err);
      });
    }

    function syncToJinjer() {
      var btn = document.getElementById('jinjerSyncBtn');
      if (btn) { btn.disabled = true; btn.textContent = '登録中…'; }
      callServer_('adminSyncToJinjer', [CURRENT_DETAIL_ID]).then(function () {
        showToast('jinjerに登録/更新しました');
        loadDashboard();
      }).catch(function (err) {
        if (btn) { btn.disabled = false; btn.textContent = 'jinjerに登録/更新'; }
        showError(err);
      });
    }

    function sendFilesToJinjer() {
      var btn = document.getElementById('jinjerFilesBtn');
      if (btn) { btn.disabled = true; btn.textContent = '送信中…'; }
      callServer_('adminSendFilesToJinjer', [CURRENT_DETAIL_ID]).then(function () {
        showToast('承認済み書類をjinjerに送信しました');
        loadDashboard();
      }).catch(function (err) {
        if (btn) { btn.disabled = false; btn.textContent = '承認済み書類をjinjerに送る'; }
        showError(err);
      });
    }

    // ---------- LINEメッセージ(内定者とのやり取り) ----------
    var CHAT_POLL_TIMER_ = null;

    function stopChatPoll_() {
      if (CHAT_POLL_TIMER_) { clearInterval(CHAT_POLL_TIMER_); CHAT_POLL_TIMER_ = null; }
    }

    // 相手からの新着メッセージはWebhook経由で非同期に届くため、詳細画面を開いている間はポーリングで拾う
    function startChatPoll_() {
      stopChatPoll_();
      CHAT_POLL_TIMER_ = setInterval(function () {
        if (document.getElementById('chatMessages')) loadMessages_(); else stopChatPoll_();
      }, 15000);
    }

    // 属性用のescAttrとは別に、本文(タグ挿入)向けのエスケープ。LINE経由の外部入力のため必須。
    function escHtml_(v) {
      return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function chatBubbleHtml_(m) {
      var body = m.messageType === 'image'
        ? '<img src="/api/admin/line-image?id=' + m.id + '" onclick="window.open(this.src,\'_blank\')">'
        : escHtml_(m.text).replace(/\n/g, '<br>');
      var meta = (m.direction === 'out' ? (m.adminEmail || '管理者') : '内定者') + ' ・ ' + m.createdAt;
      return '<div class="chat-row ' + m.direction + '"><div class="chat-bubble">' + body + '</div><div class="chat-meta">' + meta + '</div></div>';
    }

    function renderMessages_(data) {
      var el = document.getElementById('chatMessages');
      if (!el) return;
      if (!data.messages.length) {
        el.innerHTML = '<p class="muted">' + (data.linked ? 'まだメッセージはありません' : 'この内定者はまだLINEと連携していません') + '</p>';
      } else {
        el.innerHTML = data.messages.map(chatBubbleHtml_).join('');
        el.scrollTop = el.scrollHeight;
      }
      var input = document.getElementById('chatInput');
      if (input) input.disabled = !data.linked;
    }

    function loadMessages_() {
      var empId = CURRENT_DETAIL_ID;
      callServer_('adminGetMessages', [empId]).then(function (data) {
        if (empId !== CURRENT_DETAIL_ID) return; // 応答が返る間に別の人へ切り替えていたら無視する
        renderMessages_(data);
      }).catch(function () {
        var el = document.getElementById('chatMessages');
        if (el) el.innerHTML = '<p class="muted">読み込みに失敗しました</p>';
      });
    }

    function sendChatMessage() {
      var input = document.getElementById('chatInput');
      var errorEl = document.getElementById('chatSendError');
      var text = input.value.trim();
      if (!text) return;
      if (errorEl) errorEl.textContent = '';
      input.disabled = true;
      callServer_('adminSendMessage', [CURRENT_DETAIL_ID, text]).then(function (data) {
        input.value = '';
        input.disabled = false;
        input.focus();
        renderMessages_(data);
      }).catch(function (err) {
        input.disabled = false;
        if (errorEl) errorEl.textContent = err.message;
      });
    }

    // ---------- 設定ページ(サイドタブ) ----------
    var CATEGORY_LABELS = {
      emp: '新入社員登録', tpl: 'テンプレート', job: '職種法人マスタ',
      admin: '管理者一覧', line: 'LINE公式アカウント設定', doc: '書類マスタ',
      drive: 'Google Drive連携設定', jinjer: 'jinjer連携設定', setup: '初期データ投入'
    };
    var CURRENT_SETTINGS_TAB = null;

    function loadSettings() {
      callServer_('settingsGet', []).then(function (s) { renderSettings(s); }).catch(showError);
    }

    function visibleTabs_(s) {
      return (s.tabOrder || []).filter(function (c) { return (s.myPermissions || []).indexOf(c) !== -1; });
    }

    function renderSettings(s) {
      window.__lastSettings = s;
      var tabs = visibleTabs_(s);
      if (!CURRENT_SETTINGS_TAB || tabs.indexOf(CURRENT_SETTINGS_TAB) === -1) CURRENT_SETTINGS_TAB = tabs[0] || null;
      var canDragTabs = (s.myPermissions || []).indexOf('admin') !== -1;

      var sideHtml =
        '<div class="settings-tab account-tab active" style="margin-bottom:8px;border-bottom:1px solid #EEF0F1;padding-bottom:10px;" onclick="showAccountPane()">アカウント設定</div>' +
        tabs.map(function (c) {
          return '<button class="settings-tab" data-cat="' + c + '" onclick="selectSettingsTab(\'' + c + '\')">' +
            (canDragTabs ? '<span class="handle">⠿</span>' : '') + CATEGORY_LABELS[c] + '</button>';
        }).join('');

      document.getElementById('main').innerHTML =
        '<div class="settings-shell">' +
        '<nav class="settings-side" id="settingsSide">' + sideHtml + '</nav>' +
        '<div class="settings-content" id="settingsContent"></div>' +
        '</div>';

      if (canDragTabs) enableTabDrag_();
      showSettingsTab_();
    }

    function showAccountPane() {
      document.querySelectorAll('#settingsSide .settings-tab').forEach(function (b) { b.classList.remove('active'); });
      document.querySelector('#settingsSide .account-tab').classList.add('active');
      document.getElementById('settingsContent').innerHTML =
        '<div class="card"><h2>パスワードの変更</h2>' +
        pwFieldHtml('curPw', '現在のパスワード') +
        '<div style="height:8px;"></div>' +
        pwFieldHtml('newPw', '新しいパスワード（8文字以上）') +
        '<div style="height:10px;"></div><button class="btn" onclick="doChangePassword()">変更する</button>' +
        '<div id="pwResult" class="muted" style="margin-top:8px;"></div></div>';
    }

    function doChangePassword() {
      var cur = document.getElementById('curPw').value;
      var next = document.getElementById('newPw').value;
      var resultEl = document.getElementById('pwResult');
      callAuth_('change-password', { currentPassword: cur, newPassword: next }).then(function () {
        resultEl.textContent = '変更しました。';
        document.getElementById('curPw').value = '';
        document.getElementById('newPw').value = '';
      }).catch(function (err) { resultEl.textContent = err.message; });
    }

    function selectSettingsTab(cat) {
      CURRENT_SETTINGS_TAB = cat;
      showSettingsTab_();
    }

    function showSettingsTab_() {
      document.querySelectorAll('#settingsSide .settings-tab').forEach(function (b) {
        b.classList.toggle('active', b.dataset.cat === CURRENT_SETTINGS_TAB && !b.classList.contains('account-tab'));
      });
      document.getElementById('settingsContent').innerHTML = CURRENT_SETTINGS_TAB
        ? categoryHtml_(window.__lastSettings, CURRENT_SETTINGS_TAB)
        : '<p class="muted">表示できる設定項目がありません。</p>';
      if (CURRENT_SETTINGS_TAB === 'doc') enableDocDrag_();
      if (CURRENT_SETTINGS_TAB === 'line') {
        var webhookEl = document.getElementById('webhookUrl');
        if (webhookEl) webhookEl.textContent = location.origin + '/api/line/webhook';
      }
    }

    // ドラッグ&ドロップでの並び替え。ブラウザによってはHTML5ネイティブDnDが不安定なため、
    // Pointer Eventsだけで自前実装する(container配下、itemSelectorに一致する要素同士を入れ替える)。
    // ドラッグの開始点はhandleSelectorで指定する。行内に入力欄がある場合(書類マスタ)は
    // '.handle'のような専用の掴みアイコンだけに絞り、無い場合(サイドタブ)は行全体を指定できる。
    // 行全体を起点にする場合、実際に一定距離動かした時だけドラッグ扱いにし、動かさなければ
    // 通常のクリック(タブ切り替えなど)として扱う(直後のclickイベントを1回だけ無効化する)。
    function makeReorderable_(container, itemSelector, handleSelector, onReorder) {
      var dragEl = null;
      var startX = 0, startY = 0, dragging = false;
      var THRESHOLD = 6;

      function clearDragOver() {
        Array.prototype.forEach.call(container.querySelectorAll(itemSelector), function (el) { el.classList.remove('drag-over'); });
      }

      function targetUnder(e) {
        var el = document.elementFromPoint(e.clientX, e.clientY);
        var over = el && el.closest ? el.closest(itemSelector) : null;
        return over && container.contains(over) ? over : null;
      }

      function suppressNextClick(el) {
        var handler = function (ev) { ev.stopPropagation(); ev.preventDefault(); };
        el.addEventListener('click', handler, true);
        setTimeout(function () { el.removeEventListener('click', handler, true); }, 0);
      }

      function onMove(e) {
        if (!dragEl) return;
        if (!dragging) {
          if (Math.abs(e.clientX - startX) < THRESHOLD && Math.abs(e.clientY - startY) < THRESHOLD) return;
          dragging = true;
          dragEl.classList.add('dragging');
        }
        e.preventDefault();
        var over = targetUnder(e);
        clearDragOver();
        if (over && over !== dragEl) over.classList.add('drag-over');
      }

      function onUp(e) {
        if (!dragEl) return;
        if (dragging) {
          var over = targetUnder(e);
          dragEl.classList.remove('dragging');
          clearDragOver();
          if (over && over !== dragEl) {
            var all = Array.prototype.slice.call(container.querySelectorAll(itemSelector));
            var from = all.indexOf(dragEl), to = all.indexOf(over);
            all.splice(to, 0, all.splice(from, 1)[0]);
            onReorder(all);
          }
          suppressNextClick(dragEl);
        }
        dragEl = null;
        dragging = false;
      }

      container.addEventListener('pointerdown', function (e) {
        var handle = e.target.closest ? e.target.closest(handleSelector) : null;
        if (!handle) return;
        var item = handle.closest(itemSelector);
        if (!item || !container.contains(item)) return;
        dragEl = item;
        dragging = false;
        startX = e.clientX;
        startY = e.clientY;
        try { handle.setPointerCapture(e.pointerId); } catch (err) {}
      });
      container.addEventListener('pointermove', onMove);
      container.addEventListener('pointerup', onUp);
      container.addEventListener('pointercancel', function () { dragEl = null; dragging = false; });
    }

    function enableTabDrag_() {

        '<input type="text" id="jinjerCompanyId" value="' + escAttr(s.jinjerCompanyId || '') + '">' +
        '<div style="height:8px;"></div>' +
        '<label class="muted">APIキー（現在: ' + s.jinjerApiKeyMasked + '）</label>' +
        '<input type="text" id="jinjerApiKey" placeholder="新しいAPIキーを入力（変更する場合のみ）">' +
        '<div style="height:8px;"></div>' +
        '<label class="muted">APIシークレットキー（現在: ' + s.jinjerApiSecretKeyMasked + '）</label>' +
        '<input type="text" id="jinjerApiSecretKey" placeholder="新しいシークレットキーを入力（変更する場合のみ）">' +
        '<div style="height:8px;"></div><button class="btn" onclick="saveJinjerConfig()">保存</button> ' +
        '<button class="btn ghost" onclick="testJinjerConnection()">接続テスト</button>' +
        '<div id="jinjerTestResult" style="margin-top:8px;"></div></div>' +
        '<div class="card"><h2>市区町村マスタの同期</h2>' +
        '<p class="muted">緊急連絡先の住所（都道府県/市区町村）をjinjerの全国地方公共団体コードに変換するためのマスタデータです。' +
        '現在' + s.jinjerMunicipalityCount + '件キャッシュ済み。全国の市区町村の統廃合はごく稀なため、初回に一度実行すれば基本的に十分です。</p>' +
        '<button class="btn ghost" onclick="syncJinjerMunicipalities()">市区町村マスタを同期</button>' +
        '<div id="jinjerMunicipalityResult" style="margin-top:8px;"></div></div>' +
        '<div class="card"><h2>書類のjinjer送信対象</h2>' +
        '<p class="muted">承認済み書類をjinjerにファイル添付するには、「書類マスタ」で書類ごとにjinjerカスタム項目コードを設定してください（未設定の書類は送信対象外になります）。' +
        'カスタム項目自体はjinjer側の管理画面で先に作成しておく必要があります。</p></div>'
      );

      // 書類マスタ(旧: スプレッドシート直接編集)。ドラッグで並び替え可能
      if (cat === 'doc') return (
        '<div class="card"><h2>書類マスタ</h2>' +
        '<p class="muted">提出してもらう書類の一覧。ドラッグで表示順を並び替えられます。書類キーは一度使うと変更しないでください（提出済みデータと紐付いています）。</p>' +
        '<div id="docList">' +
          s.docTypes.map(function (d, i) {
            var cond = d.condition ? d.condition.type : '';
            var condVal = d.condition ? d.condition.value : '';
            var docCompanies = d.companies || [];
            return '<div class="doc-row" data-key="' + escAttr(d.key) + '">' +
              '<div class="row-flex"><span class="handle" style="cursor:grab;color:#C4CCC9;">⠿</span>' +
              '<input type="text" id="doc-' + i + '-label" value="' + escAttr(d.label) + '" placeholder="書類名" style="flex:1;font-weight:700;"></div>' +
              '<div class="row-flex" style="margin-top:6px;">' +
              '<label class="check"><input type="checkbox" ' + (d.requiresOriginal ? 'checked' : '') + ' id="doc-' + i + '-req"> 原本必要</label>' +
              '<label class="check"><input type="checkbox" ' + (d.pdfAllowed ? 'checked' : '') + ' id="doc-' + i + '-pdf"> PDF可</label>' +
              '<label class="check"><input type="checkbox" ' + (d.sensitive ? 'checked' : '') + ' id="doc-' + i + '-sens"> 機微情報</label>' +
              '</div>' +
              '<div class="muted" style="margin-top:8px;">対象法人（未チェックなら全法人共通）</div>' +
              '<div class="row-flex" style="margin-top:2px;">' +
              s.companies.map(function (c) {
                return '<label class="check"><input type="checkbox" class="doc-' + i + '-company" value="' + escAttr(c) + '"' + (docCompanies.indexOf(c) !== -1 ? ' checked' : '') + '> ' + c + '</label>';
              }).join('') +
              '</div>' +
              '<div class="muted" style="margin-top:8px;">通勤手段による条件（任意）</div>' +
              '<div class="row-flex" style="margin-top:2px;">' +
              '<select id="doc-' + i + '-condtype" style="width:140px;">' +
              '<option value=""' + (cond === '' ? ' selected' : '') + '>条件なし(全員)</option>' +
              '<option value="commute"' + (cond === 'commute' ? ' selected' : '') + '>通勤手段で絞る</option>' +
              '</select>' +
              '<input type="text" id="doc-' + i + '-condval" value="' + escAttr(condVal) + '" placeholder="条件の値(車/自転車など)" style="width:200px;">' +
              '</div>' +
              '<textarea id="doc-' + i + '-desc" rows="2" style="margin-top:6px;" placeholder="説明文">' + (d.description || '') + '</textarea>' +
              '<label class="muted" style="display:block;margin-top:6px;">jinjerカスタム項目コード（未設定ならjinjer送信対象外）</label>' +
              '<input type="text" id="doc-' + i + '-jinjer" value="' + escAttr(d.jinjerCustomItemCode || '') + '" placeholder="jinjer側で作成したカスタム項目のコード">' +
              '<div style="height:6px;"></div>' +
              '<button class="btn ghost" onclick="saveDocConfig(' + i + ')">保存</button> ' +
              '<button class="btn danger" onclick="removeDocConfig(\'' + escAttr(d.key) + '\')">削除</button>' +
              '<span class="muted" style="margin-left:8px;">key: ' + d.key + '</span>' +
              '</div>';
          }).join('') +
        '</div>' +
        '<hr style="margin:16px 0;border:none;border-top:1px solid #EEF0F1;">' +
        '<h3 style="font-size:.9rem;">新しい書類を追加</h3>' +
        '<div class="row-flex"><input type="text" id="newDocKey" placeholder="キー(半角英字、一意)" style="width:160px;">' +
        '<input type="text" id="newDocLabel" placeholder="書類名" style="width:200px;"></div>' +
        '<div style="height:6px;"></div><button class="btn ghost" onclick="addDocConfig()">追加</button></div>'
      );

      // 初期セットアップ
      if (cat === 'setup') return (
        '<div class="card"><h2>初期データ投入</h2>' +
        '<p class="muted">書類マスタ・テンプレートが空の場合に初期値を投入します（既にデータがある場合は何もしません。何度実行しても安全です）。</p>' +
        '<button class="btn" onclick="runSetup()">初期データを投入</button>' +
        '</div>'
      );

      return '<p class="muted">この項目を表示する権限がありません。</p>';
    }

    function runSetup() {
      callServer_('settingsRunSetup', []).then(function () { alert('完了しました'); loadSettings(); }).catch(showError);
    }

    function saveLineChannel() {
      callServer_('settingsSaveLineChannel', [
        document.getElementById('liffChannelId').value.trim(),
        document.getElementById('lineToken').value.trim(),
        document.getElementById('lineChannelSecret').value.trim()
      ]).then(renderSettingsAndToast_).catch(showError);
    }

    function saveDriveConfig() {
      callServer_('settingsSaveDriveConfig', [document.getElementById('driveRootFolderId').value.trim()])
        .then(renderSettingsAndToast_).catch(showError);
    }

    function testJinjerConnection() {
      var el = document.getElementById('jinjerTestResult');
      el.innerHTML = '<p class="muted">確認中…</p>';
      callServer_('adminTestJinjerConnection', []).then(function () {
        el.innerHTML = '<p style="color:#3F9142;">接続に成功しました（アクセストークンを取得できました）</p>';
      }).catch(function (err) {
        el.innerHTML = '<p style="color:#C1443A;">' + (err && err.message ? err.message : String(err)) + '</p>';
      });
    }

    function syncJinjerMunicipalities() {
      var el = document.getElementById('jinjerMunicipalityResult');
      el.innerHTML = '<p class="muted">同期中…（20リクエスト前後かかるため少し時間がかかります）</p>';
      callServer_('adminSyncJinjerMunicipalities', []).then(function (res) {
        el.innerHTML = '<p style="color:#3F9142;">' + res.count + '件を同期しました</p>';
      }).catch(function (err) {
        el.innerHTML = '<p style="color:#C1443A;">' + (err && err.message ? err.message : String(err)) + '</p>';
      });
    }

    function saveJinjerConfig() {
      callServer_('settingsSaveJinjerConfig', [
        document.getElementById('jinjerApiBaseUrl').value.trim(),
        document.getElementById('jinjerCompanyId').value.trim(),
        document.getElementById('jinjerApiKey').value.trim(),
        document.getElementById('jinjerApiSecretKey').value.trim()
      ]).then(renderSettingsAndToast_).catch(showError);
    }

    function syncDrivePermissions() {
      var el = document.getElementById('driveSyncResult');
      el.innerHTML = '<p class="muted">同期中…</p>';
      callServer_('adminSyncDrivePermissions', []).then(function (res) {
        el.innerHTML = res.results.map(function (r) {
          var granted = r.granted.length ? '共有: ' + r.granted.join(', ') : '共有: 変更なし';
          var revoked = r.revoked.length ? ' / 解除: ' + r.revoked.join(', ') : '';
          return '<div class="muted" style="margin-top:4px;"><b>' + r.company + '</b> — ' + granted + revoked + '</div>';
        }).join('');
      }).catch(showError);
    }

    function loadNotifLog_() {
      var el = document.getElementById('notifLog');
      el.innerHTML = '<p class="muted">読み込み中…</p>';
      callServer_('adminListNotifications', []).then(function (rows) {
        if (!rows.length) { el.innerHTML = '<p class="muted">まだ通知の記録がありません</p>'; return; }
        el.innerHTML = '<table><thead><tr><th>日時</th><th>宛先</th><th>状態</th><th>本文</th></tr></thead><tbody>' +
          rows.map(function (r) {
            var okStyle = r.Status.indexOf('送信済み') === 0 ? 'color:#3F9142;' : 'color:#C4881B;';
            return '<tr><td>' + r.Timestamp + '</td><td>' + r.Direction + '</td>' +
              '<td style="' + okStyle + 'font-weight:700;">' + r.Status + '</td>' +
              '<td class="muted" style="max-width:320px;white-space:pre-wrap;">' + r.Message + '</td></tr>';
          }).join('') + '</tbody></table>';
      }).catch(showError);
    }

    function addAdmin() {
      var myNumberCompanies = Array.prototype.slice.call(document.querySelectorAll('.mynum-chk:checked')).map(function (el) { return el.value; });
      var permissions = Array.prototype.slice.call(document.querySelectorAll('.newadmin-perm:checked')).map(function (el) { return el.value; });
      callServer_('settingsAddAdmin', [
        document.getElementById('newAdminName').value.trim(),
        document.getElementById('newAdminEmail').value.trim(),
        document.getElementById('newAdminCompany').value.trim(),
        document.getElementById('newAdminLineId').value.trim(),
        permissions,
        myNumberCompanies
      ]).then(renderSettingsAndToast_).catch(showError);
    }

    function removeAdmin(id) {
      callServer_('settingsRemoveAdmin', [id]).then(renderSettingsAndToast_).catch(showError);
    }

    function toggleEditPermissions(adminId) {
      var row = document.getElementById('editPerm-' + adminId);
      row.style.display = row.style.display === 'none' ? '' : 'none';
    }

    function saveAdminEdit(adminId) {
      var permissions = Array.prototype.slice.call(document.querySelectorAll('.editperm-' + adminId + ':checked')).map(function (el) { return el.value; });
      var myNumberCompanies = Array.prototype.slice.call(document.querySelectorAll('.editmynum-' + adminId + ':checked')).map(function (el) { return el.value; });
      callServer_('settingsUpdateAdmin', [
        adminId,
        document.getElementById('editName-' + adminId).value.trim(),
        document.getElementById('editEmail-' + adminId).value.trim(),
        document.getElementById('editCompany-' + adminId).value,
        document.getElementById('editLineId-' + adminId).value.trim(),
        permissions,
        myNumberCompanies
      ]).then(renderSettingsAndToast_).catch(showError);
    }

    function addEmployee() {
      callServer_('settingsAddEmployee', [
        document.getElementById('newEmpName').value.trim(),
        document.getElementById('newEmpKana').value.trim(),
        document.getElementById('newEmpJobType').value
      ]).then(function (res) {
        document.getElementById('empResult').textContent = '登録しました（ID: ' + res.employeeId + '）。上記のURLを本人にお伝えください。';
        document.getElementById('newEmpName').value = '';
        document.getElementById('newEmpKana').value = '';
        document.getElementById('newEmpJobType').value = '';
      }).catch(showError);
    }

    function bulkSetHireDate() {
      var date = document.getElementById('bulkHireDate').value;
      var resultEl = document.getElementById('bulkHireDateResult');
      if (!date) { resultEl.textContent = '入社予定日を入力してください'; return; }
      resultEl.textContent = '設定中…';
      callServer_('settingsBulkSetHireDate', [date]).then(function (res) {
        resultEl.textContent = res.updated + '件に設定しました。';
      }).catch(showError);
    }

    function toggleEditEmployee(id) {
      var row = document.getElementById('editEmp-' + id);
      row.style.display = row.style.display === 'none' ? '' : 'none';
    }

    function saveEmployeeEdit(id) {
      callServer_('settingsUpdateEmployee', [
        id,
        document.getElementById('editEmpName-' + id).value.trim(),
        document.getElementById('editEmpKana-' + id).value.trim(),
        document.getElementById('editEmpJobType-' + id).value,
        document.getElementById('editEmpHireDate-' + id).value,
        document.getElementById('editEmpJinjerId-' + id).value.trim()
      ]).then(renderSettingsAndToast_).catch(showError);
    }

    function removeEmployee(id, name) {
      if (!confirm(name + 'さんを削除しますか？提出済みの書類・履歴もすべて削除され、元に戻せません。')) return;
      callServer_('settingsRemoveEmployee', [id]).then(renderSettingsAndToast_).catch(showError);
    }

    // 一括登録ボタンを押したときに初めてExcel/CSV読み込みライブラリを読み込む
    var SHEETJS_LOADING = null;
    function ensureSheetJs() {
      if (window.XLSX) return Promise.resolve();
      if (SHEETJS_LOADING) return SHEETJS_LOADING;
      SHEETJS_LOADING = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        s.onload = resolve;
        s.onerror = function () { SHEETJS_LOADING = null; reject(new Error('読み込みライブラリの取得に失敗しました')); };
        document.head.appendChild(s);
      });
      return SHEETJS_LOADING;
    }

    function bulkAddEmployees() {
      var input = document.getElementById('bulkEmpFile');
      var file = input.files[0];
      var resultEl = document.getElementById('bulkEmpResult');
      if (!file) { resultEl.textContent = 'ファイルを選択してください'; return; }
      resultEl.textContent = '読み込み中…';
      ensureSheetJs().then(function () {
        parseAndSendBulk_(file, resultEl, 'settingsBulkAddEmployees', function (res) {
          var msg = res.added.length + '件登録しました。';
          if (res.errors.length) {
            msg += ' エラー ' + res.errors.length + '件：' + res.errors.map(function (er) { return er.row + '行目: ' + er.reason; }).join(' / ');
          }
          return msg;
        });
      }).catch(function (err) { resultEl.textContent = String(err && err.message || err); });
    }

    function bulkLinkJinjerEmployees() {
      var input = document.getElementById('bulkJinjerFile');
      var file = input.files[0];
      var resultEl = document.getElementById('bulkJinjerResult');
      if (!file) { resultEl.textContent = 'ファイルを選択してください'; return; }
      resultEl.textContent = '読み込み中…';
      ensureSheetJs().then(function () {
        parseAndSendBulk_(file, resultEl, 'settingsBulkLinkJinjerEmployees', function (res) {
          var msg = res.linked.length + '件紐付けました。';
          if (res.errors.length) {
            msg += ' エラー ' + res.errors.length + '件：' + res.errors.map(function (er) { return er.row + '行目: ' + er.reason; }).join(' / ');
          }
          return msg;
        });
      }).catch(function (err) { resultEl.textContent = String(err && err.message || err); });
    }

    // Excel/CSVを読み込んでサーバーの一括処理関数fnNameに投げる共通処理。
    // formatResult(res) はサーバーからの結果を画面表示用の文字列に整形する。
    function parseAndSendBulk_(file, resultEl, fnName, formatResult) {
      var reader = new FileReader();
      reader.onload = function (e) {
        try {
          var data = new Uint8Array(e.target.result);
          var workbook = XLSX.read(data, { type: 'array', cellDates: true });
          var firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
          if (!rows.length) { resultEl.textContent = 'データ行が見つかりませんでした'; return; }
          callServer_(fnName, [rows]).then(function (res) {
            resultEl.textContent = formatResult(res);
          }).catch(showError);
        } catch (err) {
          resultEl.textContent = 'ファイルの読み込みに失敗しました: ' + err;
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function addTemplate(type) {
      var title = document.getElementById('newTpl-' + type + '-title').value.trim();
      var text = document.getElementById('newTpl-' + type + '-text').value.trim();
      if (!title || !text) return;
      callServer_('settingsAddTemplate', [type, title, text]).then(renderSettingsAndToast_).catch(showError);
    }

    function removeTemplate(id) {
      callServer_('settingsRemoveTemplate', [id]).then(renderSettingsAndToast_).catch(showError);
    }

    function addJobType() {
      var jobType = document.getElementById('newJobType').value.trim();
      var company = document.getElementById('newJobTypeCompany').value;
      if (!jobType) return;
      callServer_('settingsSaveJobType', [jobType, company]).then(renderSettingsAndToast_).catch(showError);
    }

    function removeJobType(jobType) {
      callServer_('settingsRemoveJobType', [jobType]).then(renderSettingsAndToast_).catch(showError);
    }

    function saveDocConfig(i) {
      var s = window.__lastSettings;
      var d = s.docTypes[i];
      var label = document.getElementById('doc-' + i + '-label').value.trim();
      if (!label) { showError(new Error('書類名を入力してください')); return; }
      var condType = document.getElementById('doc-' + i + '-condtype').value;
      var condVal = document.getElementById('doc-' + i + '-condval').value.trim();
      var companies = Array.prototype.slice.call(document.querySelectorAll('.doc-' + i + '-company:checked')).map(function (el) { return el.value; });
      var doc = {
        key: d.key,
        label: label,
        requiresOriginal: document.getElementById('doc-' + i + '-req').checked,
        pdfAllowed: document.getElementById('doc-' + i + '-pdf').checked,
        sensitive: document.getElementById('doc-' + i + '-sens').checked,
        description: document.getElementById('doc-' + i + '-desc').value,
        condition: condType && condVal ? { type: condType, value: condVal } : undefined,
        companies: companies,
        jinjerCustomItemCode: document.getElementById('doc-' + i + '-jinjer').value.trim()
      };
      callServer_('settingsSaveDocConfig', [doc, i]).then(renderSettingsAndToast_).catch(showError);
    }

    function removeDocConfig(key) {
      if (!confirm('この書類を削除しますか？(提出済みの記録は残ります)')) return;
      callServer_('settingsRemoveDocConfig', [key]).then(renderSettingsAndToast_).catch(showError);
    }

    function addDocConfig() {
      var key = document.getElementById('newDocKey').value.trim();
      var label = document.getElementById('newDocLabel').value.trim();
      if (!key || !label) return;
      var s = window.__lastSettings;
      callServer_('settingsSaveDocConfig', [{ key: key, label: label }, s.docTypes.length]).then(renderSettingsAndToast_).catch(showError);
    }

    boot();
  </script>
